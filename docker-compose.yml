name: archivero

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archivero
      POSTGRES_PASSWORD: archivero
      POSTGRES_DB: archivero
    ports:
      - "5432:5432"
    volumes:
      - archivero-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivero -d archivero"]
      interval: 5s
      timeout: 5s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - archivero-s3:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  archivero-postgres:
  archivero-s3:
