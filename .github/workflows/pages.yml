name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir la demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: DEMO_BASE=/Archivero/ bun run build:demo
      - name: Preparar la navegación de la SPA
        run: |
          cp apps/web/dist-demo/index.html apps/web/dist-demo/404.html
          touch apps/web/dist-demo/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-demo

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
