name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  tests:
    name: Pruebas de API y e2e
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://archivero:archivero@localhost:5432/archivero_test
      JWT_SECRET: ci-session-secret-with-at-least-32-characters
      SESSION_TTL_HOURS: '8'
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: archivero-test
      S3_ACCESS_KEY_ID: archivero
      S3_SECRET_ACCESS_KEY: archivero-secret
      S3_FORCE_PATH_STYLE: 'true'
      MAX_FILE_SIZE_MB: '25'
      MAINTENANCE_SECRET: ci-maintenance-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Levantar PostgreSQL y almacenamiento
        run: docker compose up -d --wait

      - name: Crear la base de pruebas
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U archivero -d archivero; then break; fi
            sleep 1
          done
          docker compose exec -T postgres createdb -U archivero archivero_test

      - name: Esperar al almacenamiento S3
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8333/; then exit 0; fi
            sleep 1
          done
          docker compose logs seaweedfs
          exit 1

      - name: Pruebas de integración de la API
        run: bun run test

      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Flujo completo e2e
        run: bun run test:e2e

      - name: Guardar el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Registros de los contenedores
        if: failure()
        run: docker compose logs

      - name: Apagar los servicios
        if: always()
        run: docker compose down -v
